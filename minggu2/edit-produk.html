<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter Template | OatToks Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] } } } }</script>
  <style type="text/tailwindcss">
    .ic { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-link { @apply flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold text-teal-100/80 transition hover:bg-teal-900 hover:text-white; }
    .nav-link.active { @apply bg-teal-900 text-white; box-shadow: inset 3px 0 0 #fcd34d; }
  </style>
</head>
<body class="bg-stone-100 font-sans text-stone-700 antialiased">
  <div class="flex min-h-screen">

    <!-- navigasi -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 flex w-64 -translate-x-full flex-col bg-teal-950 transition-transform lg:static lg:translate-x-0">
      <div class="flex h-16 items-center gap-3 px-6 text-lg font-extrabold text-white">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-amber-300 text-teal-950">O</span> OatToks
      </div>
      <nav class="flex-1 space-y-1 px-4 py-4">
        <a href="dashboard.html" class="nav-link"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"/></svg>Dashboard</a>
        <a href="products.html" class="nav-link"><svg class="ic" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>Products</a>
        <a href="#" class="nav-link"><svg class="ic" viewBox="0 0 24 24"><path d="M16 19v-1a4 4 0 00-4-4H8a4 4 0 00-4 4v1M10 11a3 3 0 100-6 3 3 0 000 6zM20 19v-1a4 4 0 00-3-3.9M15 5.1a3 3 0 010 5.8"/></svg>Users</a>
        <a href="#" class="nav-link"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 4v6M8 14v6"/></svg>Setting</a>
      </nav>
      <div class="border-t border-teal-900 p-4">
        <a href="index.html" class="nav-link hover:!bg-red-500/20 hover:!text-red-200"><svg class="ic" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>Logout</a>
      </div>
    </aside>
    <div id="overlay" class="fixed inset-0 z-20 hidden bg-black/40 lg:hidden"></div>

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- header -->
      <header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-stone-200 bg-white/90 px-4 backdrop-blur sm:px-6">
        <button id="menu-btn" class="rounded-lg p-2 hover:bg-stone-100 lg:hidden" aria-label="Buka menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <p class="hidden text-sm text-stone-500 lg:block">Panel admin toko tanaman</p>
        <div class="flex items-center gap-3">
          <div class="text-right text-sm leading-tight"><p class="font-bold text-stone-800">Agatha Alicia</p><p class="text-xs text-stone-500">Admin toko</p></div>
          <span class="grid h-9 w-9 place-items-center rounded-full bg-teal-800 text-sm font-bold text-white">AA</span>
        </div>
      </header>

      <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <h1 class="text-2xl font-extrabold text-stone-900">Edit Produk</h1>
        <p class="mt-1 text-stone-500">Ubah data produk, lalu tekan Submit.</p>

        <form action="products.html" class="mt-6 max-w-2xl space-y-5 rounded-2xl border border-stone-200 bg-white p-6">
          <div>
            <label for="name" class="text-sm font-semibold text-stone-800">Name</label>
            <input id="name" name="name" type="text" required placeholder="Contoh: Monstera Deliciosa" value="Monstera Deliciosa"
                   class="mt-1.5 w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm placeholder:text-stone-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/20">
          </div>
          <div>
            <label for="stock" class="text-sm font-semibold text-stone-800">Stock</label>
            <input id="stock" name="stock" type="number" min="0" required placeholder="0" value="45"
                   class="mt-1.5 w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm placeholder:text-stone-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/20">
          </div>
          <div>
            <label for="description" class="text-sm font-semibold text-stone-800">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Tulis deskripsi singkat tanaman atau perlengkapan berkebun"
                      class="mt-1.5 w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm placeholder:text-stone-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/20">Tanaman hias daun berlubang khas, cocok untuk indoor dengan cahaya tidak langsung.</textarea>
          </div>
          <div class="flex items-center gap-3 pt-1">
            <button type="submit" class="rounded-lg bg-teal-800 px-5 py-2.5 text-sm font-bold text-white transition hover:bg-teal-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-800">Submit</button>
            <a href="products.html" class="rounded-lg px-4 py-2.5 text-sm font-semibold text-stone-600 hover:bg-stone-100">Batal</a>
          </div>
        </form>
      </main>

      <!-- footer -->
      <footer class="border-t border-stone-200 px-4 py-4 text-center text-sm text-stone-500 sm:px-6">&copy; 2026 OatToks. Dibuat untuk tugas lab TailwindCSS.</footer>
    </div>
  </div>

  <script>
    const sb = document.getElementById('sidebar'), ov = document.getElementById('overlay');
    const toggle = () => { sb.classList.toggle('-translate-x-full'); ov.classList.toggle('hidden'); };
    document.getElementById('menu-btn').onclick = toggle; ov.onclick = toggle;
    // Tandai menu aktif sesuai halaman (add/edit produk ikut menu Products)
    const page = location.pathname.split('/').pop();
    const parent = { 'add-produk.html': 'products.html', 'edit-produk.html': 'products.html' };
    document.querySelectorAll('.nav-link').forEach(a => a.getAttribute('href') === (parent[page] || page) && a.classList.add('active'));
  </script>
</body>
</html>
