<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | OatToks Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] } } } }</script>
</head>
<body class="bg-stone-100 font-sans text-stone-700 antialiased">
  <div class="grid min-h-screen lg:grid-cols-2">

    <!-- Panel kiri: identitas toko -->
    <section class="relative hidden overflow-hidden bg-teal-950 p-12 text-white lg:flex lg:flex-col lg:justify-between"
             style="background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px;">
      <div class="flex items-center gap-3 text-xl font-extrabold">
        <span class="grid h-10 w-10 place-items-center rounded-xl bg-amber-300 text-teal-950">O</span> OatToks
      </div>
      <div class="max-w-md">
        <h2 class="text-4xl font-extrabold leading-tight">Rawat tokomu, sesubur tanamannya.</h2>
        <p class="mt-4 leading-relaxed text-teal-100/80">Pantau penjualan, atur stok tanaman dan perlengkapan berkebun, tanpa berpindah-pindah aplikasi.</p>
      </div>
      <p class="text-sm text-teal-100/60">&copy; 2026 OatToks</p>
    </section>

    <!-- Panel kanan: form login -->
    <main class="flex items-center justify-center p-6 sm:p-12">
      <div class="w-full max-w-sm">
        <div class="mb-8 flex items-center gap-3 text-xl font-extrabold text-stone-900 lg:hidden">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-amber-300 text-teal-950">O</span> OatToks
        </div>
        <h1 class="text-2xl font-extrabold text-stone-900">Masuk ke akun admin</h1>
        <p class="mt-1.5 text-sm text-stone-500">Masukkan username dan password untuk melanjutkan.</p>

        <form id="login-form" class="mt-8 space-y-5">
          <div>
            <label for="username" class="text-sm font-semibold text-stone-800">Username</label>
            <input id="username" type="text" required autocomplete="username" placeholder="admin"
                   class="mt-1.5 w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm placeholder:text-stone-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/20">
          </div>
          <div>
            <label for="password" class="text-sm font-semibold text-stone-800">Password</label>
            <input id="password" type="password" required autocomplete="current-password" placeholder="Masukkan password"
                   class="mt-1.5 w-full rounded-lg border border-stone-300 bg-white px-3.5 py-2.5 text-sm placeholder:text-stone-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/20">
          </div>
          <label class="flex items-center gap-2 text-sm text-stone-600">
            <input type="checkbox" class="h-4 w-4 rounded border-stone-300 accent-teal-800"> Ingat saya di perangkat ini
          </label>
          <button type="submit"
                  class="w-full rounded-lg bg-teal-800 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-teal-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-800">
            Login
          </button>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Simulasi login: semua username & password diterima, lalu menuju dashboard
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
