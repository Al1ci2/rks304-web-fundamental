<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 border rounded-lg">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Daftar Akun</h1>
    <p class="text-sm text-slate-500 mb-6">Isi data diri kamu di bawah ini.</p>

    <form id="registerForm" action="dashboard.html" method="get" novalidate class="space-y-4">

      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" id="username" name="username"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-yellow-500" />
        <p id="usernameError" class="text-red-600 text-sm mt-1 hidden"></p>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" name="password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-yellow-500" />
        <p id="passwordError" class="text-red-600 text-sm mt-1 hidden"></p>
      </div>
      <div>
        <label for="nama" class="block text-sm font-medium text-slate-700 mb-1">Nama</label>
        <input type="text" id="nama" name="nama"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-yellow-500" />
        <p id="namaError" class="text-red-600 text-sm mt-1 hidden"></p>
      </div>
      <div>
        <label for="tanggalLahir" class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir</label>
        <input type="date" id="tanggalLahir" name="tanggalLahir"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-yellow-500" />
        <p id="tanggalLahirError" class="text-red-600 text-sm mt-1 hidden"></p>
      </div>
      <div>
        <label for="alamat" class="block text-sm font-medium text-slate-700 mb-1">Alamat</label>
        <textarea id="alamat" name="alamat" rows="3"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-yellow-500"></textarea>
        <p id="alamatError" class="text-red-600 text-sm mt-1 hidden"></p>
      </div>
      <div>
        <label for="telepon" class="block text-sm font-medium text-slate-700 mb-1">Nomor Telepon</label>
        <input type="text" id="telepon" name="telepon" placeholder="628123456789"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-yellow-500" />
        <p id="teleponError" class="text-red-600 text-sm mt-1 hidden"></p>
      </div>

      <button type="submit"
        class="w-full bg-amber-200 hover:bg-amber-300 text-black font-semibold py-2 rounded-lg transition">
        Daftar
      </button>
    </form>
  </div>


  <script src="validasi_input.js"></script>
</body>
</html>
