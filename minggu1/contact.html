<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Alicia Agatha</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <p class="brand-tag">Welcome To<br>My Portfolio</p>

            <nav class="main-nav" aria-label="Navigasi Utama">
                <ul>
                    <li><a href="index.html" class="nav-pill">Home</a></li>
                    <li><a href="portfolio.html" class="nav-pill">Portfolio</a></li>
                    <li><a href="contact.html" class="nav-pill nav-active">Contact</a></li>
                </ul>
            </nav>

            <button class="menu-icon" aria-label="Buka menu navigasi">
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <section class="page-hero">
        <div class="container">
            <div class="hero-name-card page-title-card">
                <h1>Let's Connect</h1>
                <p class="page-subtitle">
                    Have a question, a project idea, or just want to say hi? Fill out the form below.
                </p>
            </div>
        </div>
    </section>

    <main>
        <section id="education-section" aria-labelledby="contact-heading">
            <div class="container">
                <h2 id="contact-heading" class="sr-only">Contact Form</h2>

                <div class="contact-card">
                    <form class="contact-form" action="#" method="post">

                        <div class="form-group">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="names@email.com" required>
                        </div>

                        <div class="form-group">
                            <label for="whatsapp">WhatsApp Number<span class="hint">(opsional)</span></label>
                            <input type="tel" id="whatsapp" name="whatsapp" placeholder="+62XXXXXXXXXXX">
                        </div>

                        <div class="form-group">
                            <label for="category">Needs</label>
                            <select id="category" name="category" required>
                                <option value="" selected disabled>Choose One!</option>
                                <option value="konsultasi">Consultation</option>
                                <option value="kolaborasi">Project Collaboration</option>
                                <option value="pertanyaan">General QnA</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" placeholder="Write Your Message Here..." required></textarea>
                        </div>

                        <button type="submit" class="btn-role">
                            <span>Send</span>
                            <span class="icon-circle icon-circle-sm">&rarr;</span>
                        </button>

                    </form>
                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Alicia Agatha Nathaniela Telaumbanua. Praktikum Web Fundamental.</p>
        </div>
    </footer>

</body>
</html>
